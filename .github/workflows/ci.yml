name: CI
on:
  push:
  pull_request:
permissions:
  contents: read   # 最小権限(NR-02)
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]   # NFR-009
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4   # koto test が Node 22.18+ の型除去を使う
        with:
          node-version: "22.18.0"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - run: python tools/validate_schemas.py target/debug/koto
        if: runner.os != 'Windows'
      - run: python tools/validate_schemas.py target/debug/koto.exe
        if: runner.os == 'Windows'

  e2e:
    # 生成した backend / web を起動して API とブラウザ操作を検証する(SQLite と PostgreSQL)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kotonoha
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kotonoha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KOTONOHA_TEST_PG_URL: postgres://kotonoha@127.0.0.1:5432/kotonoha
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: cargo build --locked
      - run: npm install --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: node --no-warnings --test tests/e2e/backend.test.ts tests/e2e/backend_security.test.ts tests/e2e/postgres.test.ts tests/e2e/web.test.ts tests/e2e/oidc.test.ts tests/e2e/extensions.test.ts tests/e2e/event_app.test.ts tests/e2e/dev.test.ts tests/e2e/izakaya_app.test.ts
      - run: ./target/debug/koto -C examples/shop test
      - run: ./target/debug/koto -C examples/lab test
      - run: ./target/debug/koto -C examples/event test
      - run: tools/mobile-syntax/run.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: tools/verify_android_jvm.sh

  android-build:
    # 生成した Android プロジェクトのビルド確認(開発環境に SDK が無いため CI で検証する: K-01)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        example: [shop, lab, event, izakaya, nippo]   # lab: 拡張部品(Kotlin)・分析・実験 / event: 実際に作ったアプリ(日時入力を含む)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: cargo build --locked
      - run: ./target/debug/koto -C examples/${{ matrix.example }} build --target android --out ${{ runner.temp }}/android
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: ${{ runner.temp }}/android

  ios-build:
    # 生成した iOS プロジェクトのビルド確認(K-01)
    runs-on: macos-15
    needs: test
    strategy:
      fail-fast: false
      matrix:
        example: [shop, lab, event, izakaya, nippo]   # lab: 拡張部品(Swift)・分析・実験 / event: 実際に作ったアプリ(日時入力を含む)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install xcodegen
      - run: cargo build --locked
      - run: ./target/debug/koto -C examples/${{ matrix.example }} build --target ios --out ${{ runner.temp }}/ios
      - run: xcodegen generate
        working-directory: ${{ runner.temp }}/ios
      - run: xcodebuild -project KotonohaApp.xcodeproj -scheme KotonohaApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ${{ runner.temp }}/ios

  security:
    # NR-02 / SEC-07 / SEC-10: 依存関係の既知の脆弱性(Rust・生成物の npm)と SBOM の確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: cargo build --locked
      - name: 生成物の npm 依存を監査
        run: |
          ./target/debug/koto -C examples/shop build --target web --out "$RUNNER_TEMP/web"
          ./target/debug/koto -C examples/shop build --target backend --out "$RUNNER_TEMP/backend"
          (cd "$RUNNER_TEMP/web" && npm install --no-audit --no-fund && npm audit --audit-level=moderate)
          (cd "$RUNNER_TEMP/backend" && npm install --no-audit --no-fund && npm audit --audit-level=moderate)
          test -s "$RUNNER_TEMP/web/sbom.cdx.json" && test -s "$RUNNER_TEMP/backend/sbom.cdx.json"
