[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED" # ADR-001 未決定
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
proptest = "1.12.0"
sqlparser = { version = "0.63.0", features = ["visitor"] }
kotonoha-diag = { path = "crates/diag" }
kotonoha-ast = { path = "crates/ast" }
kotonoha-lexer = { path = "crates/lexer" }
kotonoha-parser = { path = "crates/parser" }
kotonoha-types = { path = "crates/types" }
kotonoha-knowledge = { path = "crates/knowledge" }
kotonoha-intent = { path = "crates/intent" }
kotonoha-validator = { path = "crates/validator" }
kotonoha-graph = { path = "crates/graph" }
kotonoha-lock = { path = "crates/lock" }
kotonoha-resolver = { path = "crates/resolver" }
kotonoha-codegen = { path = "crates/codegen" }
kotonoha-driver = { path = "crates/driver" }
kotonoha-ext = { path = "crates/ext" }
